<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>StockFolio social preview</title>
  <desc>Facebook preview image for StockFolio with portfolio tracking headline, breakdown chart, and feature highlights.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27d6ff"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff38b8"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001f22"/>
      <stop offset="45%" stop-color="#020304"/>
      <stop offset="100%" stop-color="#160018"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="phoneShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="18" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#020304"/>
  <rect width="1200" height="630" fill="url(#pageGlow)"/>
  <circle cx="126" cy="104" r="260" fill="#00f5ff" opacity="0.08"/>
  <circle cx="980" cy="178" r="360" fill="#8b5cf6" opacity="0.11"/>
  <circle cx="378" cy="576" r="420" fill="#001315" opacity="0.7"/>

  <g transform="translate(72 66)">
    <rect x="0" y="0" width="31" height="31" rx="5" fill="#e9edff"/>
    <path d="M5 23L13 16L19 20L27 9" fill="none" stroke="#1c7dff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 26L13 18L19 22L27 12" fill="none" stroke="#ff4fd8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <text x="50" y="24" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#brandGradient)">StockFolio</text>
  </g>

  <text x="72" y="162" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Your whole</text>
  <text x="72" y="214" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">portfolio,</text>
  <text x="72" y="266" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#brandGradient)">beautifully</text>
  <text x="72" y="318" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#brandGradient)">in focus.</text>
  <text x="74" y="370" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cfe5ff">A fast, mobile-first tracker for stocks,</text>
  <text x="74" y="399" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cfe5ff">crypto, and global markets with live P&amp;L,</text>
  <text x="74" y="428" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cfe5ff">price alerts, and clean dark charts.</text>

  <g transform="translate(86 482)">
    <rect x="0" y="0" width="236" height="56" rx="15" fill="#06101f" stroke="#0755c9"/>
    <path d="M22 34L31 25L39 30L50 16" fill="none" stroke="#2583ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="22" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Live Portfolio</text>
    <text x="72" y="43" font-family="Inter, Arial, sans-serif" font-size="13" fill="#b9d8ff">Holdings, P&amp;L, value.</text>

    <rect x="256" y="0" width="236" height="56" rx="15" fill="#06101f" stroke="#0755c9"/>
    <path d="M282 31V22A13 13 0 0 1 308 22V31" fill="none" stroke="#2583ff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M278 32H312" stroke="#2583ff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="330" y="22" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Price Alerts</text>
    <text x="330" y="43" font-family="Inter, Arial, sans-serif" font-size="13" fill="#b9d8ff">Target moves, instantly.</text>
  </g>

