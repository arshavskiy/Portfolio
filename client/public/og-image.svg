    <rect x="0" y="0" width="360" height="252" rx="38" fill="#090909" stroke="#272727" stroke-width="4"/>
    <rect x="139" y="18" width="86" height="7" rx="4" fill="#2c2c2c"/>
    <text x="32" y="62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="url(#brandGradient)">Breakdown</text>
    <circle cx="102" cy="141" r="48" fill="none" stroke="#2e7dff" stroke-width="15"/>
    <path d="M102 93A48 48 0 0 1 149 153" fill="none" stroke="#ffad16" stroke-width="15" stroke-linecap="round"/>
    <path d="M149 153A48 48 0 0 1 74 181" fill="none" stroke="#00e696" stroke-width="15" stroke-linecap="round"/>
    <circle cx="184" cy="116" r="6" fill="#2e7dff"/>
    <text x="199" y="122" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">AAPL</text>
    <text x="260" y="122" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff">42%</text>
    <circle cx="184" cy="149" r="6" fill="#00e696"/>
    <text x="199" y="155" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">NVDA</text>
    <text x="260" y="155" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff">31%</text>
    <circle cx="184" cy="182" r="6" fill="#ffad16"/>
    <text x="199" y="188" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">BTC</text>
    <text x="260" y="188" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff">27%</text>
    <g transform="translate(132 222)">
      <circle cx="0" cy="0" r="4" fill="#2c2c2c"/>
      <circle cx="16" cy="0" r="4" fill="#2c2c2c"/>
      <rect x="28" y="-4" width="22" height="8" rx="4" fill="#2e7dff"/>
      <circle cx="64" cy="0" r="4" fill="#2c2c2c"/>
      <circle cx="80" cy="0" r="4" fill="#2c2c2c"/>
      <circle cx="96" cy="0" r="4" fill="#2c2c2c"/>
    </g>
  </g>

  <g transform="translate(875 112)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="386" rx="28" fill="#03070c" stroke="#101d35"/>

    <g transform="translate(28 34)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#06101f" stroke="#0755c9"/>
      <circle cx="24" cy="24" r="14" fill="none" stroke="#2583ff" stroke-width="2.4"/>
      <path d="M24 10V38M10 24H38" stroke="#2583ff" stroke-width="2" opacity="0.8"/>
      <text x="66" y="20" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#ffffff">Multi-Market</text>
      <text x="66" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9d8ff">US, TASE, crypto.</text>
    </g>

    <g transform="translate(28 132)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#06101f" stroke="#0755c9"/>
      <path d="M15 35V18M24 35V12M33 35V23" stroke="#2583ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M13 37H36" stroke="#2583ff" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="20" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Advanced Charts</text>
      <text x="66" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9d8ff">Lines, candles, ranges.</text>
    </g>

    <g transform="translate(28 230)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#06101f" stroke="#0755c9"/>
      <path d="M14 31L22 23L29 27L36 16" fill="none" stroke="#2583ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="20" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#ffffff">Clean Focus</text>
      <text x="66" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9d8ff">Dark, fast, readable.</text>
    </g>

    <text x="28" y="342" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748b">stockfolio.handcoded.tech</text>
