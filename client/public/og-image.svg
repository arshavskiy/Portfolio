      <text x="770" y="139" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">TODAY</text>
      <text x="770" y="169" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#00ff88">+$1,204</text>

      <rect x="916" y="112" width="160" height="78" rx="14" fill="#111827" stroke="#243044"/>
      <text x="936" y="139" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">POSITIONS</text>
      <text x="936" y="169" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">12</text>

      <rect x="584" y="210" width="322" height="188" rx="18" fill="#111827" stroke="#243044"/>
      <text x="606" y="240" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Portfolio Value</text>
      <text x="808" y="240" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#00ff88">6M +18.0%</text>
      <path d="M606 352C625 335 642 344 662 319C690 284 714 306 740 272C767 237 791 254 818 229C843 206 870 222 886 212L886 376H606Z" fill="url(#chartFill)"/>
      <path d="M606 352C625 335 642 344 662 319C690 284 714 306 740 272C767 237 791 254 818 229C843 206 870 222 886 212" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
      <circle cx="886" cy="212" r="6" fill="#00ff88"/>

      <rect x="924" y="210" width="152" height="188" rx="18" fill="#111827" stroke="#243044"/>
      <text x="944" y="240" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Top Movers</text>
      <text x="944" y="278" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">NVDA</text>
      <text x="1058" y="278" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#00ff88" text-anchor="end">+3.2%</text>
      <line x1="944" y1="298" x2="1056" y2="298" stroke="#263246"/>
      <text x="944" y="329" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">BTC</text>
      <text x="1058" y="329" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#00ff88" text-anchor="end">+2.4%</text>
      <line x1="944" y1="349" x2="1056" y2="349" stroke="#263246"/>
      <text x="944" y="380" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">TSLA</text>
      <text x="1058" y="380" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ff3366" text-anchor="end">-1.0%</text>

      <rect x="584" y="418" width="492" height="58" rx="16" fill="#111827" stroke="#243044"/>
      <text x="608" y="453" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#38bdf8">AAPL</text>
      <text x="700" y="453" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e2e8f0">Apple Inc.</text>
      <text x="870" y="453" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">$18,942</text>
      <text x="1038" y="453" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#00ff88" text-anchor="end">+1.82%</text>
    </g>
  </g>

  <text x="82" y="560" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b">stockfolio.handcoded.tech</text>
</svg>
