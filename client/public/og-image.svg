<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>StockFolio portfolio tracker dashboard preview</title>
  <desc>Social preview card for StockFolio showing portfolio performance, charts, watchlist movers, and market tracking.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="52%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151923"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="roundedScreen">
      <rect x="560" y="86" width="540" height="420" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#050608"/>
  <path d="M0 0H1200V630H0Z" fill="url(#cardGradient)"/>
  <circle cx="1010" cy="94" r="260" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="236" cy="536" r="300" fill="#a855f7" opacity="0.12"/>
  <path d="M62 552C195 475 274 506 390 438C516 365 560 220 688 182C812 145 910 208 1128 96" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <g transform="translate(78 94)">
    <rect x="0" y="0" width="78" height="78" rx="22" fill="#0f172a" stroke="#263246"/>
    <path d="M22 51L36 35L47 43L59 24" fill="none" stroke="url(#brandGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="59" cy="24" r="5" fill="#00ff88"/>
  </g>

  <text x="78" y="222" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#f8fafc">StockFolio</text>
  <text x="82" y="276" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#e2e8f0">Track stocks, crypto,</text>
  <text x="82" y="314" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#e2e8f0">and portfolio performance.</text>
  <text x="82" y="359" font-family="Inter, Arial, sans-serif" font-size="21" fill="#94a3b8">Holdings, watchlists, alerts, movers, and charts.</text>

  <g transform="translate(82 405)">
    <rect width="154" height="46" rx="23" fill="#0f172a" stroke="#263246"/>
    <circle cx="26" cy="23" r="7" fill="#00ff88"/>
    <text x="45" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Live markets</text>

    <rect x="170" width="154" height="46" rx="23" fill="#0f172a" stroke="#263246"/>
    <text x="196" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#00ff88">+18.0%</text>
    <text x="260" y="30" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">gain</text>

    <rect x="340" width="138" height="46" rx="23" fill="#0f172a" stroke="#263246"/>
    <text x="365" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">Alerts</text>
